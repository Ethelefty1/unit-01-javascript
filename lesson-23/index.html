<!DOCTYPE html>
<html>
<head>
  <title>Gradebook</title>
</head>
<body>
  <h1>Period 3 Gradebook</h1>
  <ul id="gradebook"></ul>
  <h2>Honor Roll</h2>
  <ul id="honor"></ul>

  <script>
    let students = [
      { name: "Maya", average: 94.5 },
      { name: "Leo", average: 81.4 },
      { name: "Priya", average: 67.8 },
      { name: "Sam", average: 88 },
      { name: "Jordan", average: 72.3 }
    ];

    // Write your code here, one comment above each task
//part one
    let list = document.getElementById("gradebook")
    
    //part two
     for (let i = 0; i < students.length; i++) {
        //part four
            let letterGrade = "";
            if (students[i].average >= 90) {
                letterGrade = " (A) ";
            } else if (students[i].average >= 80) {
                letterGrade = " (B) ";
            } else if (students[i].average >= 70) {
                letterGrade = " (C) ";
            } else if (students[i].average >= 60) {
                letterGrade = " (D) ";
            } else {
                letterGrade = " (F) ";
            }    
      let li = document.createElement("li");
            li.textContent = students[i].name + ": " + students[i].average.toFixed(1)+ letterGrade
          list.appendChild(li)
         }
    //part three
    let reportP = document.createElement("p");
        reportP.textContent = "Report for " + [students.length] + " students";
        document.body.appendChild(reportP);
       
            
            


  </script>
</body>
</html>
