        // ---------- Puzzle 1: Same name, different variable ----------

}

function doubleIt(num) {
    num = num * 2;
    console.log(num);
}
doubleIt(score);

    word = word.toUpperCase();
}
let pet = "dog";
shout(pet);
console.log(pet);

    return word = word.toUpperCase();// write your code here

}

earn(5);

// ---------- Puzzle 6: Loop counters ----------
// PREDICTION (A):3
// PREDICTION (B): number
// ACTUAL (A): 3
// ACTUAL (B): undefined
// WHY: Because the let is inside the for loop which doesnt go outside the loop making B not equal to anything but var is function scope
console.log("--- Puzzle 6 ---");
// Version A
for (var i = 0; i < 3; i++) { }
console.log("A:", i);

// Version B
for (let j = 0; j < 3; j++) { }
