<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let score = 10;              // 1 10 
        score += 5;                  // 2 15  
        score *= 2;                  // 3 30
        let bonus = score % 7;       // 4 2
        score -= bonus;              // 5 28
        let old = ++score;           // 6 old= 28 score 29   old 29 score 29
        let next = ++score;          // 7 next= 30 score=30
        score /= 3;                  // 8 10
        bonus--;                     // 9 1
        score = score + bonus * 4;   // 10 score=14 bonus=1 next=30 old =28     new old is 29
        console.log(score, bonus, old, next)
        
        // 1. Why is old 28 but score 29 after line 6?
        // A: Because the score comes before ++ so it makes the old = to the original score before it got ++
        // 2. Why doesn’t line 10 give 44?
        // A: Because order of operations makes multiplication come first
        // 3. What would score be if line 3 came before line 2?
        // A: 19.6666666
        </script>
</body>
</html>
